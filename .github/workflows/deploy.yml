name: Deploy Sink
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sink-production
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NUXT_SITE_TOKEN: synthetic-ci-test-token
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm types:check
      - run: pnpm build
      - run: pnpm test --run
  deploy:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEPLOY_D1_DATABASE_ID: ${{ vars.DEPLOY_D1_DATABASE_ID }}
      DEPLOY_D1_DATABASE_NAME: sink
      DEPLOY_KV_NAMESPACE_ID: ${{ vars.DEPLOY_KV_NAMESPACE_ID }}
      DEPLOY_ANALYTICS_DATASET: sink
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          cache: pnpm
      - name: Check runtime secrets
        env:
          NUXT_SITE_TOKEN: ${{ secrets.NUXT_SITE_TOKEN }}
          NUXT_CF_API_TOKEN: ${{ secrets.NUXT_CF_API_TOKEN }}
        run: test "${#NUXT_SITE_TOKEN}" -ge 32 && test -n "$NUXT_CF_API_TOKEN"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm db:migrate:remote
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Deploy with Cloudflare settings
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: >-
          pnpm exec wrangler deploy .output/server/index.mjs --assets .output/public --config wrangler.deploy.jsonc
          --var "NUXT_CF_ACCOUNT_ID:$CLOUDFLARE_ACCOUNT_ID"
          --var NUXT_DATASET:sink
          --var NUXT_PUBLIC_HOME_URL:https://link.theclau.de/dashboard
      - name: Configure runtime secrets
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NUXT_SITE_TOKEN: ${{ secrets.NUXT_SITE_TOKEN }}
          NUXT_CF_API_TOKEN: ${{ secrets.NUXT_CF_API_TOKEN }}
        run: node -e "console.log(JSON.stringify({NUXT_SITE_TOKEN:process.env.NUXT_SITE_TOKEN,NUXT_CF_API_TOKEN:process.env.NUXT_CF_API_TOKEN}))" | pnpm exec wrangler secret bulk --config wrangler.deploy.jsonc
